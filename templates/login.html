{% extends "base.html" %}
{% block title %}Login - ExamChain{% endblock %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 30px auto;">
    <h2>Sign In</h2>
    <p style="color: var(--muted); font-size: 0.9rem; margin-bottom: 20px;">
        Sign in to access exams or your admin dashboard.
    </p>

    <form method="POST" id="login-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

        <div class="form-group">
            <label for="identifier">Username, Roll No, or Email</label>
            <input
                type="text"
                id="identifier"
                name="identifier"
                value="{{ form_data.get('identifier', '') }}"
                required
                autofocus
                placeholder="Enter username, roll number, or email"
                class="form-control"
            >
        </div>

        <div class="form-group">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                name="password"
                required
                placeholder="Enter your password"
                class="form-control"
            >
        </div>

        <button type="submit" class="btn" style="width:100%; margin-top: 10px;">
            Sign In
        </button>
    </form>

    <div style="margin-top: 20px; padding-top: 15px; border-top: 1px solid var(--border); font-size: 0.85rem; color: var(--muted); text-align: center;">
        <p>Students: Not registered yet? <a href="{{ url_for('register') }}" style="color: var(--accent); font-weight: 600;">Sign up as a student</a></p>
    </div>
</div>
{% endblock %}
