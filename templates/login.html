{% extends "base.html" %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="card" style="max-width: 420px; margin: 20px auto;">
    <h2>Login</h2>

    <form method="POST">
        <label>Username or Roll No</label>
        <input
            type="text"
            name="identifier"
            required
            autofocus
            placeholder="Enter username or roll number"
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            required
            placeholder="Enter your password"
        >

        <button type="submit" class="btn" style="width:100%;">
            Login
        </button>
    </form>

    <p style="color: var(--muted); font-size: 0.85rem; margin-top: 12px;">
        Students can log in using either their username or roll number.
    </p>

    <p style="color: var(--muted); font-size: 0.85rem; margin-top: 8px;">
        Not registered yet?
        <a href="{{ url_for('register') }}">Sign up as a student</a>.
    </p>
</div>
{% endblock %}
