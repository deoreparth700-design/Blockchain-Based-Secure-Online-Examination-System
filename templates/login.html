{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="card" style="max-width: 420px; margin: 20px auto;">
    <h2>Login</h2>
    <form method="POST">
        <label>Username (teacher) or Roll No (student)</label>
        <input type="text" name="identifier" required autofocus>
        <label>Password</label>
        <input type="password" name="password" required>
        <button type="submit" class="btn" style="width:100%;">Login</button>
    </form>
    <p style="color: var(--muted); font-size: 0.85rem; margin-top: 12px;">
        Not registered yet? <a href="{{ url_for('register') }}">Sign up as a student</a>.
    </p>
</div>
{% endblock %}
