<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Clipboard body -->
  <rect x="8" y="10" width="48" height="50" rx="5" ry="5" fill="#1a2340"/>
  <rect x="11" y="14" width="42" height="44" rx="3" ry="3" fill="#f0f4ff"/>
  <!-- Clipboard clip -->
  <rect x="22" y="6" width="20" height="10" rx="3" ry="3" fill="#1a2340"/>
  <rect x="26" y="8" width="12" height="6" rx="2" ry="2" fill="#4f6ef7"/>
  <!-- Subtle block/chain lines -->
  <rect x="14" y="20" width="12" height="4" rx="1" fill="#c7d2fe" opacity="0.7"/>
  <rect x="28" y="20" width="8" height="4" rx="1" fill="#c7d2fe" opacity="0.5"/>
  <rect x="14" y="27" width="8" height="3" rx="1" fill="#c7d2fe" opacity="0.4"/>
  <rect x="24" y="27" width="14" height="3" rx="1" fill="#c7d2fe" opacity="0.4"/>
  <!-- Bold checkmark -->
  <polyline points="16,42 26,52 50,28" stroke="#4f6ef7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Chain link accent (bottom right) -->
  <circle cx="50" cy="54" r="4" stroke="#f88e3e" stroke-width="2" fill="none"/>
  <circle cx="44" cy="54" r="4" stroke="#f88e3e" stroke-width="2" fill="none"/>
</svg>
